name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  format:
    name: Code Formatting Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check Formatting
        run: cargo fmt --all -- --check

  clippy-and-test:
    name: Clippy & Unit Tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Run Clippy Linter
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Workspace Tests
        run: cargo test --workspace

  linux-gateway-test:
    name: Linux Gateway Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test Core, FS, and Gateway Crates
        run: cargo test --package rpc-mcp-core --package rpc-mcp-fs --package rpc-mcp-gateway

  secret-sanity-check:
    name: Sensitive Info & Leak Prevention Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure no local secret configs or known hosts tracked
        run: |
          if git ls-files | grep -E "config\.local\.json|vps-known-hosts"; then
            echo "Error: Local config or known-hosts found in git tracking!"
            exit 1
          fi
